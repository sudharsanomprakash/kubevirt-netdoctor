apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-web-01
  namespace: demo
spec:
  podSelector:
    matchLabels:
      vm.kubevirt.io/name: web-01
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: client
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - namespaceSelector: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: other-app
  namespace: demo
spec:
  podSelector:
    matchLabels:
      app: other
  policyTypes: [Ingress]
  ingress: []
