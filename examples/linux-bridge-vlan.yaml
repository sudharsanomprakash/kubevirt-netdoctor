# A VM with the cluster pod network (masquerade) and a secondary Linux bridge
# network on VLAN 100. The node must already have a bridge named br1 (for
# example created with kubernetes-nmstate). Synthetic example.
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: br-vlan100
  namespace: demo
spec:
  config: |-
    {
      "cniVersion": "0.3.1",
      "name": "br-vlan100",
      "plugins": [
        {"type": "bridge", "bridge": "br1", "vlan": 100, "ipam": {}},
        {"type": "tuning"}
      ]
    }
---
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: web-01
  namespace: demo
spec:
  runStrategy: Always
  template:
    spec:
      domain:
        devices:
          disks:
            - name: rootdisk
              disk:
                bus: virtio
          interfaces:
            - name: default
              masquerade: {}
            - name: vlan100
              bridge: {}
        resources:
          requests:
            memory: 1Gi
      networks:
        - name: default
          pod: {}
        - name: vlan100
          multus:
            networkName: br-vlan100
      volumes:
        - name: rootdisk
          containerDisk:
            image: quay.io/containerdisks/fedora:latest
