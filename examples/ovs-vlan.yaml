# A VM attached to a secondary OVS CNI network on VLAN 200. Requires OVS CNI
# and an OVS bridge named br-data on the nodes. Synthetic example.
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: ovs-vlan200
  namespace: demo
  annotations:
    # Lets the scheduler place the VM only on nodes exposing this bridge.
    k8s.v1.cni.cncf.io/resourceName: ovs-cni.network.kubevirt.io/br-data
spec:
  config: '{"cniVersion":"0.4.0","name":"ovs-vlan200","type":"ovs","bridge":"br-data","vlan":200}'
---
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: db-02
  namespace: demo
spec:
  runStrategy: Always
  template:
    spec:
      domain:
        devices:
          disks:
            - name: rootdisk
              disk:
                bus: virtio
          interfaces:
            - name: default
              masquerade: {}
            - name: data
              bridge: {}
        resources:
          requests:
            memory: 1Gi
      networks:
        - name: default
          pod: {}
        - name: data
          multus:
            networkName: ovs-vlan200
      volumes:
        - name: rootdisk
          containerDisk:
            image: quay.io/containerdisks/fedora:latest
