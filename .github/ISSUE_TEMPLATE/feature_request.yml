name: Feature request
description: Propose a new diagnostic, data source or command
labels: ["kind/feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What networking problem would this help diagnose?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Which Kubernetes APIs or telemetry would it read? What permissions would it need?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
