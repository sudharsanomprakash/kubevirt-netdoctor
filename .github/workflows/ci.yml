name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: |
          unformatted="$(gofmt -s -l .)"
          if [ -n "$unformatted" ]; then
            echo "Files need gofmt -s:"; echo "$unformatted"; exit 1
          fi
      - name: Check go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - run: go vet ./...
      - run: go test -race -coverprofile=coverage.out ./...
      - name: Check golden files are up to date
        run: |
          go test ./internal/cli -update
          git diff --exit-code testdata/golden
      - run: go build ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0

  cross-build:
    name: Cross-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make dist VERSION=ci

  bpf:
    name: BPF sources and bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install clang and libbpf headers
        run: sudo apt-get update && sudo apt-get install -y clang llvm libbpf-dev
      - name: Compile with -Werror
        run: make bpf-check
      - name: Generated Go bindings match the BPF source
        # Object files differ between clang versions; the Go bindings
        # (types, program and map names) must not.
        run: |
          go generate ./internal/ebpf
          git diff --exit-code -- 'internal/ebpf/*.go'

  kernel:
    name: Kernel tracer (real eBPF, root)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Kernel features
        run: uname -r && ls -l /sys/kernel/btf/vmlinux
      - name: Load the tracer and trace real traffic in network namespaces
        run: sudo -E env "PATH=$PATH" go test -count=1 -v -run 'Trace' ./internal/ebpf ./internal/cli
      - name: Node capability probe (verifier load)
        run: |
          go build -o kubectl-netdoctor ./cmd/kubectl-netdoctor
          sudo ./kubectl-netdoctor host capabilities
