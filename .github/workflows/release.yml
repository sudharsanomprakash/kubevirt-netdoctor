name: Release

# Two ways to release:
#  - push a semantic version tag (vMAJOR.MINOR.PATCH); or
#  - run this workflow manually (Actions > Release > Run workflow) with a
#    version: it creates the tag on the commit it runs from (normally main).
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, for example v0.1.0 (the tag is created on the selected branch's head)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the tag and the GitHub release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Resolve version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = workflow_dispatch ]; then
            version="${INPUT_VERSION}"
            if ! printf '%s' "$version" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
              echo "version must look like v1.2.3 or v1.2.3-rc.1, got: $version" >&2
              exit 1
            fi
            if git ls-remote --exit-code --tags origin "refs/tags/$version" >/dev/null; then
              echo "tag $version already exists" >&2
              exit 1
            fi
          else
            version="${GITHUB_REF_NAME}"
          fi
          echo "VERSION=$version" >>"$GITHUB_ENV"
      - run: go test -race ./...
      - run: make dist VERSION="${VERSION}"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          # v0.x releases and versions with a pre-release suffix are pre-releases.
          case "${VERSION}" in v0.*|*-*) prerelease="--prerelease" ;; esac
          notes="--generate-notes"
          # Hand-written notes take precedence when present.
          if [ -f "docs/releases/${VERSION}.md" ]; then notes="--notes-file docs/releases/${VERSION}.md"; fi
          tag="--verify-tag"
          # A manual run creates the tag on the commit being built.
          if [ "${GITHUB_EVENT_NAME}" = workflow_dispatch ]; then tag="--target ${GITHUB_SHA}"; fi
          # shellcheck disable=SC2086
          gh release create "${VERSION}" dist/*.tar.gz dist/checksums.txt \
            --title "${VERSION}" ${notes} ${tag} ${prerelease}
